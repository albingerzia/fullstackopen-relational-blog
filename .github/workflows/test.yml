name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable
      DATABASE_SSL: 'false'
      PORT: 3001
      SECRET: test_secret

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check configuration safety
        run: npm run test:config
      - name: Run extended integration tests
        run: npm run test:integration
      - name: Start application
        run: npm run start:test > app.log 2>&1 &
      - name: Wait for application to be ready
        run: npx --no-install wait-on http://127.0.0.1:3001 -t 30000
      - name: Run official Chapter 3 tests
        run: npm test
      - name: Print application logs on failure
        if: failure()
        run: cat app.log
      - name: Stop application
        if: always()
        run: |
          pids=$(lsof -tiTCP:3001 -sTCP:LISTEN || true)
          if [ -n "$pids" ]; then
            kill $pids
          fi
